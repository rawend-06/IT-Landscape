name: IT-Landscape - CI/CD checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Toon boomstructuur (debug)
        run: |
          echo "Repository root:"
          ls -la
          echo ""
          echo "Recursieve structuur:"
          ls -R

      - name: Controleer vereiste mappen en bestanden (opdracht-structuur)
        run: |
          set -e

          required_paths=(
            "README.md"
            "CI-CD"
            "CMS"
            "Docker"
            "MongoDB"
          )

          echo "== Verplichte items check =="
          missing=0
          for p in "${required_paths[@]}"; do
            if [ ! -e "$p" ]; then
              echo "::error::Ontbreekt: $p"
              missing=1
            else
              echo "OK: $p"
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "::error::Structuur voldoet niet aan de verwachte opdracht-layout."
            exit 1
          fi

      - name: Controleer README minimale inhoud (basis-eis)
        run: |
          set -e
          echo "== README check =="

          # Basis: README mag niet leeg zijn
          if [ ! -s README.md ]; then
            echo "::error::README.md is leeg."
            exit 1
          fi

          # Optioneel: controleer of README een titel bevat
          if ! grep -qiE '^#\s+' README.md; then
            echo "::warning::README.md heeft geen duidelijke titel (# ...)."
          fi

          # Optioneel: check op kernwoorden die vaak in opdrachten staan
          for keyword in "Docker" "MongoDB" "CI" "CD"; do
            if ! grep -qi "$keyword" README.md; then
              echo "::notice::Tip: README mist mogelijk sectie/woord: $keyword"
            fi
          done

      - name: Docker Compose validatie (alleen als compose bestand bestaat)
        run: |
          set -e
          echo "== Docker(Compose) check =="

          # zoek compose bestanden (meest voorkomende namen)
          found_compose=0
          for f in "docker-compose.yml" "docker-compose.yaml" "compose.yml" "compose.yaml"; do
            if [ -f "$f" ]; then
              echo "Compose gevonden in root: $f"
              found_compose=1
            fi
          done

          # zoek ook in Docker/ map
          for f in "Docker/docker-compose.yml" "Docker/docker-compose.yaml" "Docker/compose.yml" "Docker/compose.yaml"; do
            if [ -f "$f" ]; then
              echo "Compose gevonden in Docker/: $f"
              found_compose=1
            fi
          done

          if [ "$found_compose" -eq 0 ]; then
            echo "Geen compose bestand gevonden — stap wordt overgeslagen."
            exit 0
          fi

          # Docker is aanwezig op GitHub runner; compose plugin meestal ook.
          # We draaien config-validatie op het gevonden bestand (eerste match).
          compose_file=""
          for f in "docker-compose.yml" "docker-compose.yaml" "compose.yml" "compose.yaml" \
                   "Docker/docker-compose.yml" "Docker/docker-compose.yaml" "Docker/compose.yml" "Docker/compose.yaml"; do
            if [ -f "$f" ]; then
              compose_file="$f"
              break
            fi
          done

          echo "Valideer compose: $compose_file"
          docker compose -f "$compose_file" config

      - name: Extra: controleer of Dockerfile bestaat (alleen als je Docker gebruikt)
        run: |
          set -e
          echo "== Dockerfile check =="

          # Zoek Dockerfile(s)
          count=$(find . -maxdepth 3 -type f -iname "Dockerfile" | wc -l)
          echo "Aantal Dockerfiles (max diepte 3): $count"

          if [ "$count" -eq 0 ]; then
            echo "::notice::Geen Dockerfile gevonden. Als opdracht Docker build vereist, voeg er één toe."
          fi